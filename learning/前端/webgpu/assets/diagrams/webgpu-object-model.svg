<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6472"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4C6FFF"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <!-- 白底与标题 -->
  <rect width="960" height="540" fill="#FFFFFF"/>
  <text x="50" y="52" font-size="28" fill="#1F2430" font-weight="600">WebGPU 对象模型</text>
  <text x="50" y="78" font-size="14" fill="#5B6472">Object Model · 从浏览器入口到命令提交的引用链</text>

  <!-- 行一：入口 → 适配器 → 设备 -->
  <rect x="50" y="110" width="190" height="80" rx="8" fill="#EEF0F6" stroke="#1F2430" stroke-width="1.5"/>
  <text x="145" y="142" font-size="15" fill="#1F2430" text-anchor="middle" font-weight="600">navigator.gpu</text>
  <text x="145" y="164" font-size="12" fill="#5B6472" text-anchor="middle">JS 入口 · 能力检测</text>
  <text x="145" y="181" font-size="11" fill="#5B6472" text-anchor="middle">'gpu' in navigator</text>

  <line x1="240" y1="150" x2="304" y2="150" stroke="#5B6472" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-dim)"/>
  <text x="273" y="138" font-size="11.5" fill="#5B6472" text-anchor="middle">requestAdapter()</text>

  <rect x="310" y="110" width="240" height="80" rx="8" fill="#F6F7FB" stroke="#1F2430" stroke-width="2"/>
  <text x="430" y="138" font-size="16" fill="#1F2430" text-anchor="middle" font-weight="600">GPUAdapter</text>
  <text x="430" y="158" font-size="12" fill="#5B6472" text-anchor="middle">物理 GPU · 能力快照</text>
  <text x="430" y="176" font-size="11" fill="#5B6472" text-anchor="middle">adapter.limits / adapter.features</text>

  <line x1="550" y1="150" x2="614" y2="150" stroke="#5B6472" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-dim)"/>
  <text x="583" y="138" font-size="11.5" fill="#5B6472" text-anchor="middle">requestDevice()</text>

  <rect x="620" y="110" width="290" height="80" rx="8" fill="#E9EDFB" stroke="#4C6FFF" stroke-width="2"/>
  <text x="765" y="138" font-size="16" fill="#1F2430" text-anchor="middle" font-weight="600">GPUDevice</text>
  <text x="765" y="158" font-size="12" fill="#5B6472" text-anchor="middle">逻辑会话 · 资源工厂</text>
  <text x="765" y="176" font-size="11" fill="#5B6472" text-anchor="middle">device.lost 承诺设备丢失事件</text>

  <!-- 设备 → 资源对象的总线 -->
  <text x="488" y="214" font-size="12" fill="#4C6FFF" text-anchor="middle">Device.create*() —— 描述符在创建时即验证</text>
  <line x1="765" y1="190" x2="765" y2="222" stroke="#5B6472" stroke-width="1.8"/>
  <line x1="132" y1="222" x2="844" y2="222" stroke="#5B6472" stroke-width="1.8"/>
  <line x1="132" y1="222" x2="132" y2="250" stroke="#5B6472" stroke-width="1.8" marker-end="url(#arrow-dim)"/>
  <line x1="310" y1="222" x2="310" y2="250" stroke="#5B6472" stroke-width="1.8" marker-end="url(#arrow-dim)"/>
  <line x1="488" y1="222" x2="488" y2="250" stroke="#5B6472" stroke-width="1.8" marker-end="url(#arrow-dim)"/>
  <line x1="666" y1="222" x2="666" y2="250" stroke="#5B6472" stroke-width="1.8" marker-end="url(#arrow-dim)"/>
  <line x1="844" y1="222" x2="844" y2="250" stroke="#5B6472" stroke-width="1.8" marker-end="url(#arrow-dim)"/>

  <!-- 行二：五类资源对象 -->
  <rect x="50" y="254" width="164" height="68" rx="6" fill="#EEF0F6" stroke="#5B6472" stroke-width="1.2"/>
  <text x="132" y="284" font-size="13" fill="#1F2430" text-anchor="middle" font-weight="600">GPUBuffer</text>
  <text x="132" y="304" font-size="11" fill="#5B6472" text-anchor="middle">顶点 · 索引 · uniform 字节</text>

  <rect x="228" y="254" width="164" height="68" rx="6" fill="#EEF0F6" stroke="#5B6472" stroke-width="1.2"/>
  <text x="310" y="284" font-size="13" fill="#1F2430" text-anchor="middle" font-weight="600">GPUTexture</text>
  <text x="310" y="304" font-size="11" fill="#5B6472" text-anchor="middle">颜色附件 · 深度缓冲</text>

  <rect x="406" y="254" width="164" height="68" rx="6" fill="#EEF0F6" stroke="#5B6472" stroke-width="1.2"/>
  <text x="488" y="284" font-size="13" fill="#1F2430" text-anchor="middle" font-weight="600">GPUShaderModule</text>
  <text x="488" y="304" font-size="11" fill="#5B6472" text-anchor="middle">WGSL 编译单元</text>

  <rect x="584" y="254" width="164" height="68" rx="6" fill="#EEF0F6" stroke="#5B6472" stroke-width="1.2"/>
  <text x="666" y="284" font-size="13" fill="#1F2430" text-anchor="middle" font-weight="600">GPURenderPipeline</text>
  <text x="666" y="304" font-size="11" fill="#5B6472" text-anchor="middle">状态组合 · 创建后不可变</text>

  <rect x="762" y="254" width="164" height="68" rx="6" fill="#EEF0F6" stroke="#5B6472" stroke-width="1.2"/>
  <text x="844" y="284" font-size="13" fill="#1F2430" text-anchor="middle" font-weight="600">GPUBindGroup</text>
  <text x="844" y="304" font-size="11" fill="#5B6472" text-anchor="middle">资源与槽位的绑定</text>

  <!-- 行三：创建时验证注解 + 提交队列 -->
  <rect x="50" y="400" width="560" height="76" rx="8" fill="#F6F7FB" stroke="#8B5CF6" stroke-width="1.5"/>
  <text x="74" y="426" font-size="13" fill="#1F2430" font-weight="600">创建时验证（creation-time validation）</text>
  <text x="74" y="448" font-size="11.5" fill="#5B6472">非法描述符在 create*() 当场报错：错误暴露在资源创建处，而不是拖到 draw 现场</text>
  <text x="74" y="466" font-size="11.5" fill="#5B6472">writeBuffer 上传后，JS 侧只剩句柄，真身在 GPU 进程里</text>

  <rect x="660" y="400" width="250" height="76" rx="8" fill="#E9EDFB" stroke="#4C6FFF" stroke-width="2"/>
  <text x="785" y="426" font-size="16" fill="#1F2430" text-anchor="middle" font-weight="600">GPUQueue</text>
  <text x="785" y="446" font-size="12" fill="#5B6472" text-anchor="middle">device.queue · 提交通道</text>
  <text x="785" y="464" font-size="11" fill="#5B6472" text-anchor="middle">writeBuffer / submit</text>

  <!-- 设备 → 队列（右侧折线引用） -->
  <path d="M 910 148 L 938 148 L 938 438 L 914 438" fill="none" stroke="#4C6FFF" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- 队列 → GPU 执行 -->
  <line x1="785" y1="476" x2="785" y2="500" stroke="#8B5CF6" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-violet)"/>
  <text x="770" y="498" font-size="11.5" fill="#8B5CF6" text-anchor="end">submit 之后异步执行</text>

  <!-- 底部注释 -->
  <text x="480" y="522" font-size="14" fill="#1F2430" text-anchor="middle">一切资源经 Device 创建、经 Queue 提交：JS 持有句柄，GPU 进程持有真身</text>
  <text x="480" y="538" font-size="11" fill="#5B6472" text-anchor="middle">Objects are created by the device, consumed by the queue</text>
</svg>
