<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6472"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4C6FFF"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <!-- 白底与标题 -->
  <rect width="960" height="540" fill="#FFFFFF"/>
  <text x="50" y="52" font-size="28" fill="#1F2430" font-weight="600">CPU 与 GPU 的分工</text>
  <text x="50" y="78" font-size="14" fill="#5B6472">Heterogeneous Architecture · WebGPU 一帧命令从提交到执行</text>

  <!-- CPU 面板 -->
  <rect x="50" y="110" width="230" height="330" rx="8" fill="#F6F7FB" stroke="#1F2430" stroke-width="2"/>
  <text x="165" y="140" font-size="20" fill="#1F2430" text-anchor="middle" font-weight="600">CPU</text>
  <text x="165" y="160" font-size="13" fill="#5B6472" text-anchor="middle">顺序优化 · 低延迟</text>

  <rect x="70" y="180" width="90" height="72" rx="6" fill="#EEF0F6" stroke="#1F2430" stroke-width="1.5"/>
  <rect x="170" y="180" width="90" height="72" rx="6" fill="#EEF0F6" stroke="#1F2430" stroke-width="1.5"/>
  <rect x="70" y="264" width="90" height="72" rx="6" fill="#EEF0F6" stroke="#1F2430" stroke-width="1.5"/>
  <rect x="170" y="264" width="90" height="72" rx="6" fill="#EEF0F6" stroke="#1F2430" stroke-width="1.5"/>
  <text x="115" y="212" font-size="13" fill="#1F2430" text-anchor="middle">核 0</text>
  <text x="215" y="212" font-size="13" fill="#1F2430" text-anchor="middle">核 1</text>
  <text x="115" y="296" font-size="13" fill="#1F2430" text-anchor="middle">核 2</text>
  <text x="215" y="296" font-size="13" fill="#1F2430" text-anchor="middle">核 3</text>
  <text x="115" y="234" font-size="11" fill="#5B6472" text-anchor="middle">控制单元</text>
  <text x="215" y="234" font-size="11" fill="#5B6472" text-anchor="middle">控制单元</text>
  <text x="115" y="318" font-size="11" fill="#5B6472" text-anchor="middle">控制单元</text>
  <text x="215" y="318" font-size="11" fill="#5B6472" text-anchor="middle">控制单元</text>

  <rect x="70" y="352" width="190" height="40" rx="6" fill="#E9EDFB" stroke="#4C6FFF" stroke-width="1.5"/>
  <text x="165" y="377" font-size="13" fill="#1F2430" text-anchor="middle">L1 / L2 / L3 大缓存</text>
  <text x="165" y="424" font-size="12" fill="#5B6472" text-anchor="middle">少数强核 · 复杂逻辑 · 分支预测</text>

  <!-- GPU 面板 -->
  <rect x="430" y="110" width="480" height="330" rx="8" fill="#F6F7FB" stroke="#1F2430" stroke-width="2"/>
  <text x="670" y="140" font-size="20" fill="#1F2430" text-anchor="middle" font-weight="600">GPU</text>
  <text x="670" y="160" font-size="13" fill="#5B6472" text-anchor="middle">吞吐优化 · 高带宽</text>

  <rect x="450" y="176" width="440" height="32" rx="6" fill="#E9EDFB" stroke="#4C6FFF" stroke-width="1.5"/>
  <text x="670" y="197" font-size="12.5" fill="#1F2430" text-anchor="middle">命令处理器 Command Processor（消费命令缓冲）</text>

  <!-- SIMT 计算单元阵列：8 × 3 -->
  <g fill="#EEF0F6" stroke="#5B6472" stroke-width="1.2">
    <rect x="450" y="222" width="48" height="36" rx="3"/><rect x="504" y="222" width="48" height="36" rx="3"/><rect x="558" y="222" width="48" height="36" rx="3"/><rect x="612" y="222" width="48" height="36" rx="3"/><rect x="666" y="222" width="48" height="36" rx="3"/><rect x="720" y="222" width="48" height="36" rx="3"/><rect x="774" y="222" width="48" height="36" rx="3"/><rect x="828" y="222" width="48" height="36" rx="3"/>
    <rect x="450" y="264" width="48" height="36" rx="3"/><rect x="504" y="264" width="48" height="36" rx="3"/><rect x="558" y="264" width="48" height="36" rx="3"/><rect x="612" y="264" width="48" height="36" rx="3"/><rect x="666" y="264" width="48" height="36" rx="3"/><rect x="720" y="264" width="48" height="36" rx="3"/><rect x="774" y="264" width="48" height="36" rx="3"/><rect x="828" y="264" width="48" height="36" rx="3"/>
    <rect x="450" y="306" width="48" height="36" rx="3"/><rect x="504" y="306" width="48" height="36" rx="3"/><rect x="558" y="306" width="48" height="36" rx="3"/><rect x="612" y="306" width="48" height="36" rx="3"/><rect x="666" y="306" width="48" height="36" rx="3"/><rect x="720" y="306" width="48" height="36" rx="3"/><rect x="774" y="306" width="48" height="36" rx="3"/><rect x="828" y="306" width="48" height="36" rx="3"/>
  </g>
  <!-- 高亮一个线程束：同一行的 8 个单元执行同一指令 -->
  <g fill="none" stroke="#4C6FFF" stroke-width="2">
    <rect x="450" y="222" width="48" height="36" rx="3"/><rect x="504" y="222" width="48" height="36" rx="3"/><rect x="558" y="222" width="48" height="36" rx="3"/><rect x="612" y="222" width="48" height="36" rx="3"/><rect x="666" y="222" width="48" height="36" rx="3"/><rect x="720" y="222" width="48" height="36" rx="3"/><rect x="774" y="222" width="48" height="36" rx="3"/><rect x="828" y="222" width="48" height="36" rx="3"/>
  </g>
  <text x="670" y="362" font-size="11.5" fill="#5B6472" text-anchor="middle">SIMT 阵列：数千轻量计算单元，高亮行即一个线程束（warp），同指令并行</text>

  <!-- 显存层次 -->
  <rect x="450" y="384" width="120" height="16" rx="3" fill="#4C6FFF"/>
  <text x="510" y="396" font-size="10.5" fill="#FFFFFF" text-anchor="middle">寄存器 极快·极小</text>
  <rect x="450" y="404" width="240" height="16" rx="3" fill="#8FA5FF"/>
  <text x="570" y="416" font-size="10.5" fill="#FFFFFF" text-anchor="middle">共享内存 / L1 快·小</text>
  <rect x="450" y="424" width="380" height="16" rx="3" fill="#C7D2FF"/>
  <text x="640" y="436" font-size="10.5" fill="#1F2430" text-anchor="middle">显存 VRAM 慢·大</text>

  <!-- 面板之间的通路 -->
  <line x1="285" y1="180" x2="422" y2="180" stroke="#5B6472" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-dim)"/>
  <text x="355" y="170" font-size="12" fill="#5B6472" text-anchor="middle">命令提交 submit（异步）</text>

  <line x1="285" y1="255" x2="422" y2="255" stroke="#4C6FFF" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="355" y="245" font-size="12" fill="#4C6FFF" text-anchor="middle">数据上传 writeBuffer</text>

  <line x1="425" y1="330" x2="288" y2="330" stroke="#8B5CF6" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-violet)"/>
  <text x="355" y="320" font-size="12" fill="#8B5CF6" text-anchor="middle">读回（昂贵，尽量避免）</text>

  <!-- 底部注释 -->
  <text x="480" y="492" font-size="14" fill="#1F2430" text-anchor="middle">一帧的旅程：JS 录制命令 → submit 提交队列 → GPU 调度执行 → 结果写入画布</text>
  <text x="480" y="514" font-size="11" fill="#5B6472" text-anchor="middle">From JavaScript to Pixels</text>
</svg>
