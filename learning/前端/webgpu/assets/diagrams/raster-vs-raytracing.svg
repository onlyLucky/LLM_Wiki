<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" font-family="PingFang SC, Hiragino Sans GB, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B6472"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4C6FFF"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <!-- 白底与标题 -->
  <rect width="960" height="540" fill="#FFFFFF"/>
  <text x="50" y="52" font-size="28" fill="#1F2430" font-weight="600">同一场景的两种画法：光栅化与光线追踪</text>
  <text x="50" y="78" font-size="14" fill="#5B6472">Rasterization vs. Ray Tracing · 正向投影与逆向求交</text>

  <!-- ============ 左：光栅化（正向） ============ -->
  <rect x="50" y="105" width="425" height="285" rx="8" fill="#F6F7FB" stroke="#1F2430" stroke-width="2"/>
  <text x="70" y="130" font-size="15" fill="#1F2430" font-weight="600">光栅化 · 正向投影</text>
  <text x="70" y="148" font-size="11.5" fill="#5B6472">Rasterization — 把物体「推」向屏幕</text>

  <!-- 场景：光源 + 方盒 + 球 + 地面 -->
  <circle cx="105" cy="180" r="9" fill="#F59E0B"/>
  <text x="105" y="205" font-size="11" fill="#5B6472" text-anchor="middle">光源</text>
  <line x1="80" y1="302" x2="255" y2="302" stroke="#5B6472" stroke-width="1.5"/>
  <rect x="115" y="248" width="58" height="54" rx="3" fill="#EEF0F6" stroke="#1F2430" stroke-width="1.5"/>
  <circle cx="218" cy="268" r="34" fill="#E9EDFB" stroke="#4C6FFF" stroke-width="1.8"/>
  <text x="165" y="330" font-size="11.5" fill="#5B6472" text-anchor="middle">三角形网格场景</text>

  <!-- 变换箭头 -->
  <line x1="262" y1="238" x2="296" y2="238" stroke="#4C6FFF" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="279" y="226" font-size="11" fill="#4C6FFF" text-anchor="middle">MVP</text>

  <!-- 像素网格：被三角形覆盖的片元 -->
  <g stroke="#B9C0CF" stroke-width="0.8" fill="#FFFFFF">
    <rect x="302" y="178" width="16" height="16"/><rect x="318" y="178" width="16" height="16"/><rect x="334" y="178" width="16" height="16"/><rect x="350" y="178" width="16" height="16"/><rect x="366" y="178" width="16" height="16"/>
    <rect x="302" y="194" width="16" height="16"/><rect x="318" y="194" width="16" height="16"/><rect x="334" y="194" width="16" height="16"/><rect x="350" y="194" width="16" height="16"/><rect x="366" y="194" width="16" height="16"/>
    <rect x="302" y="210" width="16" height="16"/><rect x="318" y="210" width="16" height="16"/><rect x="334" y="210" width="16" height="16"/><rect x="350" y="210" width="16" height="16"/><rect x="366" y="210" width="16" height="16"/>
    <rect x="302" y="226" width="16" height="16"/><rect x="318" y="226" width="16" height="16"/><rect x="334" y="226" width="16" height="16"/><rect x="350" y="226" width="16" height="16"/><rect x="366" y="226" width="16" height="16"/>
    <rect x="302" y="242" width="16" height="16"/><rect x="318" y="242" width="16" height="16"/><rect x="334" y="242" width="16" height="16"/><rect x="350" y="242" width="16" height="16"/><rect x="366" y="242" width="16" height="16"/>
  </g>
  <!-- 三角形覆盖的片元（下三角） -->
  <g fill="#8FA5FF">
    <rect x="302" y="242" width="16" height="16"/>
    <rect x="318" y="226" width="16" height="16"/><rect x="318" y="242" width="16" height="16"/>
    <rect x="334" y="210" width="16" height="16"/><rect x="334" y="226" width="16" height="16"/><rect x="334" y="242" width="16" height="16"/>
    <rect x="350" y="194" width="16" height="16"/><rect x="350" y="210" width="16" height="16"/><rect x="350" y="226" width="16" height="16"/><rect x="350" y="242" width="16" height="16"/>
    <rect x="366" y="178" width="16" height="16"/><rect x="366" y="194" width="16" height="16"/><rect x="366" y="210" width="16" height="16"/><rect x="366" y="226" width="16" height="16"/><rect x="366" y="242" width="16" height="16"/>
  </g>
  <!-- 投影后的三角形轮廓 -->
  <polygon points="302,258 382,258 382,178" fill="none" stroke="#4C6FFF" stroke-width="1.8"/>
  <text x="342" y="278" font-size="11.5" fill="#5B6472" text-anchor="middle">屏幕像素</text>

  <!-- 三步流程 -->
  <text x="395" y="192" font-size="12" fill="#1F2430">① 顶点变换</text>
  <text x="395" y="217" font-size="12" fill="#1F2430">② 光栅化</text>
  <text x="395" y="242" font-size="12" fill="#1F2430">③ 片元着色</text>

  <text x="262" y="352" font-size="12" fill="#1F2430" text-anchor="middle">流程：顶点变换 → 三角形覆盖像素 → 逐片元着色</text>
  <text x="262" y="374" font-size="11.5" fill="#5B6472" text-anchor="middle">擅长：海量三角形与实时帧率</text>

  <!-- ============ 右：光线追踪（逆向） ============ -->
  <rect x="505" y="105" width="405" height="285" rx="8" fill="#F6F7FB" stroke="#1F2430" stroke-width="2"/>
  <text x="525" y="130" font-size="15" fill="#1F2430" font-weight="600">光线追踪 · 逆向求交</text>
  <text x="525" y="148" font-size="11.5" fill="#5B6472">Ray Tracing — 从像素「拉」出一条光线</text>

  <!-- 相机 -->
  <circle cx="560" cy="230" r="10" fill="#1F2430"/>
  <text x="560" y="262" font-size="11" fill="#5B6472" text-anchor="middle">相机 eye</text>

  <!-- 像素墙：高亮一枚被追踪的像素 -->
  <g stroke="#B9C0CF" stroke-width="0.8" fill="#FFFFFF">
    <rect x="630" y="178" width="16" height="16"/><rect x="646" y="178" width="16" height="16"/><rect x="662" y="178" width="16" height="16"/><rect x="678" y="178" width="16" height="16"/><rect x="694" y="178" width="16" height="16"/>
    <rect x="630" y="194" width="16" height="16"/><rect x="646" y="194" width="16" height="16"/><rect x="662" y="194" width="16" height="16"/><rect x="678" y="194" width="16" height="16"/><rect x="694" y="194" width="16" height="16"/>
    <rect x="630" y="210" width="16" height="16"/><rect x="646" y="210" width="16" height="16"/><rect x="662" y="210" width="16" height="16"/><rect x="678" y="210" width="16" height="16"/><rect x="694" y="210" width="16" height="16"/>
    <rect x="630" y="226" width="16" height="16"/><rect x="646" y="226" width="16" height="16"/><rect x="662" y="226" width="16" height="16"/><rect x="678" y="226" width="16" height="16"/><rect x="694" y="226" width="16" height="16"/>
    <rect x="630" y="242" width="16" height="16"/><rect x="646" y="242" width="16" height="16"/><rect x="662" y="242" width="16" height="16"/><rect x="678" y="242" width="16" height="16"/><rect x="694" y="242" width="16" height="16"/>
  </g>
  <rect x="662" y="194" width="16" height="16" fill="#E9EDFB" stroke="#4C6FFF" stroke-width="1.5"/>
  <text x="670" y="278" font-size="11.5" fill="#5B6472" text-anchor="middle">像素</text>

  <!-- 场景：光源 + 方盒 + 球 + 地面（与左侧同一场景） -->
  <line x1="730" y1="310" x2="890" y2="310" stroke="#5B6472" stroke-width="1.5"/>
  <rect x="748" y="256" width="54" height="54" rx="3" fill="#EEF0F6" stroke="#1F2430" stroke-width="1.5"/>
  <circle cx="838" cy="272" r="32" fill="#E9EDFB" stroke="#4C6FFF" stroke-width="1.8"/>
  <circle cx="872" cy="168" r="8" fill="#F59E0B"/>
  <text x="872" y="150" font-size="11" fill="#5B6472" text-anchor="middle">光源</text>

  <!-- 主光线：相机 → 像素 → 场景求交 -->
  <line x1="560" y1="230" x2="885" y2="130" stroke="#4C6FFF" stroke-width="1.8"/>
  <line x1="560" y1="230" x2="808" y2="261" stroke="#4C6FFF" stroke-width="1.8"/>
  <line x1="560" y1="230" x2="748" y2="276" stroke="#4C6FFF" stroke-width="1.8"/>
  <text x="610" y="196" font-size="11" fill="#4C6FFF">主光线</text>

  <!-- 命中点与阴影光线 -->
  <circle cx="808" cy="261" r="3" fill="#4C6FFF"/>
  <circle cx="748" cy="276" r="3" fill="#4C6FFF"/>
  <line x1="808" y1="261" x2="868" y2="173" stroke="#8B5CF6" stroke-width="1.8" stroke-dasharray="6 5" marker-end="url(#arrow-violet)"/>
  <text x="856" y="224" font-size="11" fill="#8B5CF6" text-anchor="end">阴影光线</text>

  <text x="707" y="352" font-size="12" fill="#1F2430" text-anchor="middle">流程：像素 → 相机射线 → 场景求交 → 向光源验证阴影</text>
  <text x="707" y="374" font-size="11.5" fill="#5B6472" text-anchor="middle">擅长：软阴影、反射与全局效果（慢）</text>

  <!-- 底部注释 -->
  <text x="480" y="495" font-size="14" fill="#1F2430" text-anchor="middle">同一场景，两条路：光栅化把三角形推向像素，快；光线追踪从像素拉出光线求交，真</text>
  <text x="480" y="517" font-size="11" fill="#5B6472" text-anchor="middle">Same scene, two paradigms: forward rasterization vs. backward ray tracing</text>
</svg>
