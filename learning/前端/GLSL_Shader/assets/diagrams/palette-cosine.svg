<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" font-family="ui-monospace, 'Cascadia Code', Consolas, 'Noto Sans Mono CJK SC', monospace">
  <title>余弦调色板图：上部为公式与 a 基线、b 振幅、c 频率、d 相位四参数图例，下部为基准色带与分别只改一个参数的四条对比色带</title>
  <rect width="720" height="520" fill="#0B0E14"/>

  <defs>
    <!-- iq 基准卡：a=b=(0.5,0.5,0.5) c=(1,1,1) d=(0.0,0.33,0.67)，按公式逐点计算 -->
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF1E0D"/>
      <stop offset="0.125" stop-color="#DA05A3"/>
      <stop offset="0.25" stop-color="#8010EF"/>
      <stop offset="0.375" stop-color="#255CFA"/>
      <stop offset="0.5" stop-color="#00BDBD"/>
      <stop offset="0.625" stop-color="#25FA5D"/>
      <stop offset="0.75" stop-color="#80EF10"/>
      <stop offset="0.875" stop-color="#DAA305"/>
      <stop offset="1" stop-color="#FF1E0D"/>
    </linearGradient>
    <!-- d + 0.15：同一条渐变整体平移 15% -->
    <linearGradient id="shift" x1="0" y1="0" x2="1" y2="0" gradientTransform="translate(0.15,0)" spreadMethod="repeat">
      <stop offset="0" stop-color="#FF1E0D"/>
      <stop offset="0.125" stop-color="#DA05A3"/>
      <stop offset="0.25" stop-color="#8010EF"/>
      <stop offset="0.375" stop-color="#255CFA"/>
      <stop offset="0.5" stop-color="#00BDBD"/>
      <stop offset="0.625" stop-color="#25FA5D"/>
      <stop offset="0.75" stop-color="#80EF10"/>
      <stop offset="0.875" stop-color="#DAA305"/>
      <stop offset="1" stop-color="#FF1E0D"/>
    </linearGradient>
    <!-- b × 1.4：对比更强 -->
    <filter id="contrast" x="0" y="0" width="100%" height="100%">
      <feComponentTransfer>
        <feFuncR type="linear" slope="1.4" intercept="-0.2"/>
        <feFuncG type="linear" slope="1.4" intercept="-0.2"/>
        <feFuncB type="linear" slope="1.4" intercept="-0.2"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <text x="360" y="40" text-anchor="middle" font-size="18" fill="#E8ECF4">余弦调色板：一个公式装下一整套配色</text>
  <text x="360" y="70" text-anchor="middle" font-size="15" fill="#FFC145">col(t) = a + b · cos( TAU · (c · t + d) )</text>

  <!-- 四参数图例 -->
  <g font-size="12">
    <rect x="120" y="92" width="12" height="12" rx="3" fill="#FF4D6D"/>
    <text x="140" y="103" fill="#FF4D6D">a · 基线：整条色带整体亮暗</text>
    <rect x="300" y="92" width="12" height="12" rx="3" fill="#4CC9F0"/>
    <text x="320" y="103" fill="#4CC9F0">b · 振幅：对比的强弱</text>
    <rect x="450" y="92" width="12" height="12" rx="3" fill="#FFC145"/>
    <text x="470" y="103" fill="#FFC145">c · 频率：循环几次</text>
    <rect x="580" y="92" width="12" height="12" rx="3" fill="#8A93A6"/>
    <text x="600" y="103" fill="#8A93A6">d · 相位：从哪开始</text>
  </g>

  <!-- 色带 1：基准 -->
  <text x="70" y="150" font-size="13" fill="#E8ECF4">基准</text>
  <text x="70" y="170" font-size="11" fill="#8A93A6">iq 彩虹卡</text>
  <rect x="180" y="132" width="470" height="36" rx="6" fill="url(#base)"/>
  <text x="665" y="154" font-size="11" fill="#8A93A6" text-anchor="end">a=b=0.5 · c=1 · d=(0,0.33,0.67)</text>

  <!-- 色带 2：只改 a（+0.12 → 提亮，用半透明白罩层表达） -->
  <text x="70" y="212" font-size="13" fill="#FF4D6D">a + 0.12</text>
  <text x="70" y="232" font-size="11" fill="#8A93A6">基线上移</text>
  <rect x="180" y="194" width="470" height="36" rx="6" fill="url(#base)"/>
  <rect x="180" y="194" width="470" height="36" rx="6" fill="#FFFFFF" opacity="0.13"/>
  <text x="665" y="216" font-size="11" fill="#8A93A6" text-anchor="end">整条变亮 · 暗部不死黑</text>

  <!-- 色带 3：只改 b（×1.4 → 对比更强，filter 表达） -->
  <text x="70" y="274" font-size="13" fill="#4CC9F0">b × 1.4</text>
  <text x="70" y="294" font-size="11" fill="#8A93A6">振幅拉大</text>
  <rect x="180" y="256" width="470" height="36" rx="6" fill="url(#base)" filter="url(#contrast)"/>
  <text x="665" y="278" font-size="11" fill="#8A93A6" text-anchor="end">对比更凶 · 赛博感</text>

  <!-- 色带 4：只改 d（+0.15 → 平移，gradientTransform 表达） -->
  <text x="70" y="336" font-size="13" fill="#FFC145">d + 0.15</text>
  <text x="70" y="356" font-size="11" fill="#8A93A6">相位平移</text>
  <rect x="180" y="318" width="470" height="36" rx="6" fill="url(#shift)"/>
  <text x="665" y="340" font-size="11" fill="#8A93A6" text-anchor="end">同一条带整体挪位 · 微调配色的主旋钮</text>

  <!-- c 频率说明（不画第五条带，用文字补充 c 的对照） -->
  <text x="70" y="398" font-size="13" fill="#8A93A6">c × 2</text>
  <text x="180" y="398" font-size="12" fill="#8A93A6">频率翻倍：同一条色带在 t 方向循环两次 —— 纹理密度的旋钮（页面版式原因不另画，改 c 看循环次数）</text>

  <!-- 底部要点 -->
  <rect x="50" y="425" width="620" height="62" rx="6" fill="#141A24" stroke="#3A4356" stroke-width="1"/>
  <text x="360" y="450" text-anchor="middle" font-size="12" fill="#E8ECF4">为什么是余弦不是线性插值：RGB 三通道错开相位（d 三个分量不同）→ 过渡自然带色偏，「渐变不脏」的秘密</text>
  <text x="360" y="472" text-anchor="middle" font-size="12" fill="#8A93A6">t 可以是任何 0–1 信号：噪声值、SDF 距离、时间 —— 你调的从来不是颜色，是 t 的分布</text>
  <text x="360" y="505" text-anchor="middle" font-size="12" fill="#8A93A6">收尾别忘了 pow(col, vec3(0.4545)) —— gamma 校正，最后一步、指数 0.4545</text>
</svg>
