<svg xmlns="http://www.w3.org/2000/svg" width="720" height="520" viewBox="0 0 720 520" font-family="ui-monospace, 'Cascadia Code', Consolas, 'Noto Sans Mono CJK SC', monospace">
  <title>SIMT 示意：左边一份 fragment 着色器程序，右边 8×5 像素网格，每格拿到不同的 uv 值并行执行同一份指令；其中一列高亮展示分支发散——同一批线程里 if 的两个分支都要执行</title>
  <rect width="720" height="520" fill="#0B0E14"/>

  <!-- 标题 -->
  <text x="360" y="40" text-anchor="middle" font-size="18" fill="#E8ECF4">SIMT：一条指令，数百万份拷贝</text>
  <text x="360" y="62" text-anchor="middle" font-size="12" fill="#8A93A6">同一个 fragment 函数，GPU 对每个像素各执行一遍 —— 讲义 1.1</text>

  <!-- 左：唯一的程序 -->
  <rect x="40" y="110" width="244" height="270" rx="6" fill="#10151F" stroke="#3A4356" stroke-width="1.5"/>
  <text x="162" y="140" text-anchor="middle" font-size="12" fill="#4CC9F0">一份程序 · FRAGMENT</text>
  <g font-size="12" fill="#C8D0DE">
    <text x="60" y="176">vec3 shade(vec2 uv) {</text>
    <text x="76" y="200">if (uv.x &gt; 0.5) {</text>
    <text x="92" y="224" fill="#FF4D6D">return ROSE;</text>
    <text x="76" y="248">}</text>
    <text x="92" y="272" fill="#4CC9F0">return CYAN;</text>
    <text x="60" y="296">}</text>
  </g>
  <text x="162" y="346" text-anchor="middle" font-size="12" fill="#8A93A6">你只写「对一个像素做什么」</text>

  <!-- 中：并行箭头 -->
  <defs>
    <marker id="arrow-rose2" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#FF4D6D"/>
    </marker>
  </defs>
  <line x1="292" y1="245" x2="336" y2="245" stroke="#FF4D6D" stroke-width="2" marker-end="url(#arrow-rose2)"/>
  <text x="314" y="230" text-anchor="middle" font-size="12" fill="#FF4D6D">并行</text>

  <!-- 右：8×5 像素网格，每格不同 uv -->
  <text x="546" y="100" text-anchor="middle" font-size="12" fill="#8A93A6">GPU 线程阵列 · 每格一个像素</text>
  <g>
    <!-- 行 r=0..4, 列 c=0..7：ux = 0.06+c*0.13, uy = 0.92-r*0.21 -->
    <!-- row 0 -->
    <g font-size="11" fill="#8A93A6" text-anchor="middle">
      <g stroke="#2A3242" stroke-width="1" fill="#141A24">
        <rect x="340" y="110" width="46" height="42" rx="3"/><rect x="390" y="110" width="46" height="42" rx="3"/><rect x="440" y="110" width="46" height="42" rx="3"/>
        <rect x="490" y="110" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/>
        <rect x="540" y="110" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/>
        <rect x="590" y="110" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/>
        <rect x="640" y="110" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/>
        <rect x="690" y="110" width="26" height="42" rx="3"/>
      </g>
      <text x="363" y="127">.06</text><text x="363" y="143">.92</text>
      <text x="413" y="127">.19</text><text x="413" y="143">.92</text>
      <text x="463" y="127">.32</text><text x="463" y="143">.92</text>
      <text x="513" y="127" fill="#FFC145">.45</text><text x="513" y="143" fill="#FFC145">.92</text>
      <text x="563" y="127" fill="#FFC145">.58</text><text x="563" y="143" fill="#FFC145">.92</text>
      <text x="613" y="127" fill="#FFC145">.71</text><text x="613" y="143" fill="#FFC145">.92</text>
      <text x="663" y="127" fill="#FFC145">.84</text><text x="663" y="143" fill="#FFC145">.92</text>
      <text x="703" y="127">.97</text><text x="703" y="143">.92</text>
      <!-- row 1 -->
      <text x="363" y="174">.06</text><text x="363" y="190">.71</text>
      <text x="413" y="174">.19</text><text x="413" y="190">.71</text>
      <text x="463" y="174">.32</text><text x="463" y="190">.71</text>
      <text x="513" y="174" fill="#FFC145">.45</text><text x="513" y="190" fill="#FFC145">.71</text>
      <text x="563" y="174" fill="#FFC145">.58</text><text x="563" y="190" fill="#FFC145">.71</text>
      <text x="613" y="174" fill="#FFC145">.71</text><text x="613" y="190" fill="#FFC145">.71</text>
      <text x="663" y="174" fill="#FFC145">.84</text><text x="663" y="190" fill="#FFC145">.71</text>
      <text x="703" y="174">.97</text><text x="703" y="190">.71</text>
      <!-- row 2 -->
      <text x="363" y="221">.06</text><text x="363" y="237">.50</text>
      <text x="413" y="221">.19</text><text x="413" y="237">.50</text>
      <text x="463" y="221">.32</text><text x="463" y="237">.50</text>
      <text x="513" y="221" fill="#FFC145">.45</text><text x="513" y="237" fill="#FFC145">.50</text>
      <text x="563" y="221" fill="#FFC145">.58</text><text x="563" y="237" fill="#FFC145">.50</text>
      <text x="613" y="221" fill="#FFC145">.71</text><text x="613" y="237" fill="#FFC145">.50</text>
      <text x="663" y="221" fill="#FFC145">.84</text><text x="663" y="237" fill="#FFC145">.50</text>
      <text x="703" y="221">.97</text><text x="703" y="237">.50</text>
      <!-- row 3 -->
      <text x="363" y="268">.06</text><text x="363" y="284">.29</text>
      <text x="413" y="268">.19</text><text x="413" y="284">.29</text>
      <text x="463" y="268">.32</text><text x="463" y="284">.29</text>
      <text x="513" y="268" fill="#FFC145">.45</text><text x="513" y="284" fill="#FFC145">.29</text>
      <text x="563" y="268" fill="#FFC145">.58</text><text x="563" y="284" fill="#FFC145">.29</text>
      <text x="613" y="268" fill="#FFC145">.71</text><text x="613" y="284" fill="#FFC145">.29</text>
      <text x="663" y="268" fill="#FFC145">.84</text><text x="663" y="284" fill="#FFC145">.29</text>
      <text x="703" y="268">.97</text><text x="703" y="284">.29</text>
      <!-- row 4 -->
      <text x="363" y="315">.06</text><text x="363" y="331">.08</text>
      <text x="413" y="315">.19</text><text x="413" y="331">.08</text>
      <text x="463" y="315">.32</text><text x="463" y="331">.08</text>
      <text x="513" y="315" fill="#FFC145">.45</text><text x="513" y="331" fill="#FFC145">.08</text>
      <text x="563" y="315" fill="#FFC145">.58</text><text x="563" y="331" fill="#FFC145">.08</text>
      <text x="613" y="315" fill="#FFC145">.71</text><text x="613" y="331" fill="#FFC145">.08</text>
      <text x="663" y="315" fill="#FFC145">.84</text><text x="663" y="331" fill="#FFC145">.08</text>
      <text x="703" y="315">.97</text><text x="703" y="331">.08</text>
    </g>
    <!-- 网格外框（列 0-3 与 7 补描边） -->
    <rect x="340" y="110" width="196" height="266" fill="none" stroke="#2A3242" stroke-width="1"/>
    <rect x="690" y="110" width="26" height="266" fill="none" stroke="#2A3242" stroke-width="1"/>
    <!-- 行 1..4 描边 -->
    <g fill="none" stroke="#2A3242" stroke-width="1">
      <rect x="340" y="157" width="46" height="42" rx="3"/><rect x="390" y="157" width="46" height="42" rx="3"/><rect x="440" y="157" width="46" height="42" rx="3"/>
      <rect x="490" y="157" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/><rect x="540" y="157" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/><rect x="590" y="157" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/><rect x="640" y="157" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/>
      <rect x="340" y="204" width="46" height="42" rx="3"/><rect x="390" y="204" width="46" height="42" rx="3"/><rect x="440" y="204" width="46" height="42" rx="3"/>
      <rect x="490" y="204" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/><rect x="540" y="204" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/><rect x="590" y="204" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/><rect x="640" y="204" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/>
      <rect x="340" y="251" width="46" height="42" rx="3"/><rect x="390" y="251" width="46" height="42" rx="3"/><rect x="440" y="251" width="46" height="42" rx="3"/>
      <rect x="490" y="251" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/><rect x="540" y="251" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/><rect x="590" y="251" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/><rect x="640" y="251" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/>
      <rect x="340" y="298" width="46" height="42" rx="3"/><rect x="390" y="298" width="46" height="42" rx="3"/><rect x="440" y="298" width="46" height="42" rx="3"/>
      <rect x="490" y="298" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/><rect x="540" y="298" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/><rect x="590" y="298" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/><rect x="640" y="298" width="46" height="42" rx="3" stroke="#FFC145" stroke-width="2"/>
    </g>
    <!-- 发散列顶部标注 -->
    <text x="590" y="386" text-anchor="middle" font-size="12" fill="#FFC145">uv.x &gt; 0.5 的一列：分支发散</text>
    <text x="590" y="406" text-anchor="middle" font-size="12" fill="#8A93A6">同一批线程里，if 的两个分支都得跑（讲义 1.3）</text>
  </g>

  <!-- 底部结论 -->
  <text x="360" y="452" text-anchor="middle" font-size="13" fill="#C8D0DE">同一指令 · 不同数据 —— 数据不同，指令相同</text>
  <text x="360" y="478" text-anchor="middle" font-size="12" fill="#8A93A6">这就是为什么 shader 不怕 4K 分辨率，只怕分支和依赖</text>
</svg>
