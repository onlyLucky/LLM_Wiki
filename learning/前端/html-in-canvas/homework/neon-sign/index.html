<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课后作业 · 深夜食堂霓虹招牌 - HTML-in-Canvas</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #05070d; color: #e8eaee;
  }
  /* Three.js 画布 = HTML-in-Canvas 画布（同一块） */
  #scene { position: fixed; inset: 0; display: block; touch-action: none; }

  /* ── HUD（画布外页面 UI） ─────────────────────────────────── */
  .hud { position: fixed; top: 20px; left: 24px; z-index: 10; pointer-events: none; }
  .hud h1 { margin: 0 0 6px; font-size: 17px; letter-spacing: 1px;
    color: #ffd9e8; text-shadow: 0 0 12px rgba(255,77,141,.55); }
  .hud p { margin: 0; font-size: 12px; line-height: 1.7; color: #9aa5c0; }
  #badge { position: fixed; top: 20px; right: 24px; z-index: 10;
    font-size: 12px; padding: 4px 12px; border-radius: 999px;
    border: 1px solid #3a3f4b; background: rgba(18,20,28,.8); color: #aab1bd; }
  #badge.native { border-color: #2ea043; color: #7ee787; }
  #badge.polyfill { border-color: #bb8009; color: #e3b341; }

  /* ══ 画布内 DOM：这些是渲染进 3D 场景的“活 HTML” ══════════════ */

  /* 主招牌 480x304px -> 世界 3.0x1.9 */
  #signMain {
    width: 480px; height: 304px;
    background: #140f1d;
    border: 4px solid #322845; border-radius: 20px;
    box-shadow: inset 0 0 60px rgba(255,77,141,.14), 0 0 34px rgba(255,45,111,.35);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; user-select: none; cursor: grab;
    /* 不写 transform -- 位置由 ThreeHTMLRenderer 每帧接管 */
  }
  #signMain .jp {
    font-size: 15px; letter-spacing: 10px; color: #6ee7ff;
    text-shadow: 0 0 8px #6ee7ffaa; padding-left: 10px;
  }
  #signMain .title {
    font-size: 86px; font-weight: 900; line-height: 1.05;
    letter-spacing: 12px; padding-left: 12px; color: #ff4d8d;
    text-shadow: 0 0 6px #ff4d8dcc, 0 0 22px #ff2d6fdd, 0 0 56px #ff2d6f99;
    animation: flicker 4.2s infinite;
  }
  #signMain .clock {
    margin-top: 4px; font-size: 30px; font-weight: 700;
    font-variant-numeric: tabular-nums; color: #6ee7ff;
    text-shadow: 0 0 10px #6ee7ffcc, 0 0 30px #22d3ee88;
  }
  #signMain .row { display: flex; align-items: center; gap: 14px; }
  #statusBtn {
    font: inherit; font-size: 15px; font-weight: 700; letter-spacing: 3px;
    padding: 5px 18px; border-radius: 999px; cursor: pointer;
    color: #7dffb0; border: 2px solid #2fbf71; background: rgba(20,60,40,.55);
    text-shadow: 0 0 8px #2fbf71cc; box-shadow: 0 0 14px rgba(47,191,113,.45);
    transition: all .2s;
  }
  #signMain.closed #statusBtn {
    color: #b8bfce; border-color: #5a6172; background: rgba(40,44,56,.55);
    text-shadow: none; box-shadow: none;
  }
  #signMain.closed .title { color: #5d5470;
    text-shadow: 0 0 10px rgba(93,84,112,.5); animation: none; }
  #signMain.closed .clock { color: #4a5568; text-shadow: none; }
  #signMain.closed .jp { color: #4a5568; text-shadow: none; }
  @keyframes flicker {
    0%, 89%, 100% { opacity: 1; }
    90% { opacity: .45; } 91% { opacity: 1; }
    95% { opacity: .72; } 96% { opacity: 1; }
  }

  /* 菜单招牌 345x360px -> 世界 2.3x2.4 */
  #signMenu {
    width: 345px; height: 360px;
    background: linear-gradient(170deg, #0d1524, #0a0f1c);
    border: 3px solid #1f3350; border-radius: 16px;
    box-shadow: inset 0 0 50px rgba(110,231,255,.08), 0 0 26px rgba(34,211,238,.25);
    display: flex; flex-direction: column; align-items: center;
    padding: 22px 20px; user-select: none; cursor: grab;
  }
  #signMenu .title {
    font-size: 30px; font-weight: 900; letter-spacing: 8px; padding-left: 8px;
    color: #6ee7ff; text-shadow: 0 0 8px #6ee7ffcc, 0 0 26px #22d3eeaa;
  }
  #signMenu .en { font-size: 11px; letter-spacing: 4px; color: #54748f; margin: 2px 0 12px; }
  #signMenu ul { list-style: none; margin: 0; padding: 0; width: 100%; }
  #signMenu li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 9px 14px; margin: 7px 0; border-radius: 10px;
    background: rgba(110,231,255,.06); border: 1px solid rgba(110,231,255,.14);
    font-size: 17px; color: #d9e6f5;
    transition: background .2s, border-color .2s;
  }
  #signMenu li:hover { background: rgba(110,231,255,.12); border-color: rgba(110,231,255,.3); }
  #signMenu li .price { color: #6ee7ff; font-weight: 700; }
  #shuffle {
    margin-top: 10px; font: inherit; font-size: 14px; font-weight: 700;
    padding: 8px 22px; border-radius: 999px; cursor: pointer;
    color: #0a0f1c; border: none; background: linear-gradient(135deg,#6ee7ff,#38bdf8);
    box-shadow: 0 0 16px rgba(56,189,248,.5); transition: filter .15s;
  }
  #shuffle:hover { filter: brightness(1.12); }
  #shuffle:active { transform: translateY(1px); }
  #signMenu .wind-row {
    margin-top: 14px; width: 100%; display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: #7c8aa5;
  }
  #wind { flex: 1; accent-color: #6ee7ff; cursor: pointer; }
  #windVal { font-variant-numeric: tabular-nums; color: #6ee7ff; min-width: 28px; }
</style>
</head>
<body>

<canvas id="scene" layoutsubtree>
  <!-- ══ 这两块 DOM 会被绘制成 3D 场景里的霓虹招牌 ══ -->
  <div id="signMain">
    <div class="jp">営 業 中</div>
    <div class="title">深夜食堂</div>
    <div class="clock" id="clock">--:--</div>
    <div class="row">
      <button id="statusBtn">OPEN · 点击打烊</button>
    </div>
  </div>

  <div id="signMenu">
    <div class="title">今日菜单</div>
    <div class="en">TODAY'S MENU</div>
    <ul id="menuList"></ul>
    <button id="shuffle">🎲 换一批</button>
    <div class="wind-row">
      <span>风</span>
      <input type="range" id="wind" min="0" max="100" value="32">
      <span id="windVal">32</span>
    </div>
  </div>
</canvas>

<header class="hud">
  <h1>课后作业 · 深夜食堂霓虹招牌</h1>
  <p>拖拽招牌感受 Verlet 物理 · 双击重置<br>招牌上的时钟、菜单、开关、风量滑条都是真实 DOM</p>
</header>
<div id="badge">正在检测运行模式…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three-html-render/polyfill": "https://cdn.jsdelivr.net/npm/three-html-render@0.1.2/dist/polyfill.mjs",
    "three-html-render/renderer": "https://cdn.jsdelivr.net/npm/three-html-render@0.1.2/dist/renderer.js"
  }
}
</script>

<script>
  // 在任何 ES Module（含 renderer.js 顶层副作用）加载前检测原生 API，
  // 否则 polyfill 补丁会被误判为原生实现。
  // 判定依据：原生 API 的 toString() 含 [native code]，polyfill 补丁是 JS 源码
  const __fn = typeof WebGLRenderingContext !== 'undefined' && WebGLRenderingContext.prototype.texElementImage2D;
  window.__hicNative = !!__fn && String(__fn).includes('[native code]');
  console.log('[neon-sign] inline 检测: hasFn=' + !!__fn + ', native=' + window.__hicNative);
</script>

<script type="module">
  import * as THREE from 'three';
  import { installHtmlInCanvasPolyfill } from 'three-html-render/polyfill';
  import { ThreeHTMLRenderer } from 'three-html-render/renderer';

  /* ═══ 0. 运行模式：原生 fast-path 或 polyfill（自动选择） ═══ */
  const native = window.__hicNative;
  installHtmlInCanvasPolyfill();   // 内部检测：原生可用走原生，否则 SVG foreignObject
  const badge = document.getElementById('badge');
  badge.textContent = native ? '原生模式（texElementImage2D）' : 'Polyfill 模式（three-html-render）';
  badge.classList.add(native ? 'native' : 'polyfill');

  /* ═══ 1. 基础场景 ═══ */
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x05070d);
  scene.fog = new THREE.Fog(0x05070d, 14, 30);

  const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(0, 2.4, 9.2);
  camera.lookAt(0, 2.3, 0);

  /* 灯光：环境光 + 顶部聚光 + 两盏跟随招牌的霓虹点光 */
  scene.add(new THREE.AmbientLight(0x3a3f55, 1.4));
  const spot = new THREE.SpotLight(0xbfd4ff, 60, 30, Math.PI / 5, 0.5, 1.2);
  spot.position.set(0, 8.5, 5);
  spot.target.position.set(0, 0.5, 0);
  scene.add(spot, spot.target);
  const neonMain = new THREE.PointLight(0xff2d6f, 14, 9, 1.8);
  const neonMenu = new THREE.PointLight(0x22d3ee, 9, 8, 1.8);
  scene.add(neonMain, neonMenu);

  /* ═══ 2. 场景静态元素：星空、电线杆、电线、地面 ═══ */
  { // 星空
    const N = 700, pos = new Float32Array(N * 3);
    for (let i = 0; i < N; i++) {
      const r = 26 + Math.random() * 40, a = Math.random() * Math.PI * 2;
      pos.set([Math.cos(a) * r, 6 + Math.random() * 26, -Math.abs(Math.sin(a)) * r - 4], i * 3);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ color: 0xaec6ff, size: 0.08, sizeAttenuation: true })));
  }
  const poleMat = new THREE.MeshStandardMaterial({ color: 0x14161f, roughness: 0.7, metalness: 0.4 });
  for (const x of [-6.5, 6.5]) {
    const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.12, 5.2, 10), poleMat);
    pole.position.set(x, 2.6, 0);
    scene.add(pole);
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.7, 8), poleMat);
    arm.rotation.z = Math.PI / 2;
    arm.position.set(x + (x < 0 ? 0.3 : -0.3), 5.0, 0);
    scene.add(arm);
  }
  // 电线：悬链近似（二次贝塞尔），并导出挂点查询函数
  const wireCurve = new THREE.QuadraticBezierCurve3(
    new THREE.Vector3(-6.5, 4.85, 0),
    new THREE.Vector3(0, 3.9, 0),
    new THREE.Vector3(6.5, 4.85, 0)
  );
  scene.add(new THREE.Mesh(
    new THREE.TubeGeometry(wireCurve, 48, 0.025, 6),
    new THREE.MeshBasicMaterial({ color: 0x2a3040 })
  ));
  const wireY = (x) => {
    const t = (x + 6.5) / 13;
    return (1 - t) ** 2 * 4.85 + 2 * (1 - t) * t * 3.9 + t ** 2 * 4.85;
  };
  // 地面：低粗糙度微反光
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(60, 60),
    new THREE.MeshStandardMaterial({ color: 0x0a0c12, roughness: 0.32, metalness: 0.75 })
  );
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  /* ═══ 3. Verlet 链条物理（对标参考实现的约束求解器） ═══ */
  const GRAVITY = 9.8;
  class Particle {
    constructor(x, y, z, fixed = false) {
      this.x = x; this.y = y; this.z = z;
      this.px = x; this.py = y; this.pz = z;
      this.fixed = fixed;
    }
  }
  class Chain {
    constructor(anchorX, anchorZ, segCount, segLen) {
      const ay = wireY(anchorX);
      this.anchor = new Particle(anchorX, ay, anchorZ, true);
      this.segLen = segLen;
      this.particles = [this.anchor];
      for (let i = 1; i <= segCount; i++) {
        this.particles.push(new Particle(anchorX, ay - i * segLen, anchorZ));
      }
      // 可视化：一条随粒子更新的折线
      this.lineGeo = new THREE.BufferGeometry();
      this.lineGeo.setAttribute('position',
        new THREE.BufferAttribute(new Float32Array((segCount + 1) * 3), 3));
      this.line = new THREE.Line(this.lineGeo, new THREE.LineBasicMaterial({ color: 0x8a94ad }));
      scene.add(this.line);
    }
    step(dt, wind) {
      const d2 = dt * dt;
      for (const p of this.particles) {
        if (p.fixed) continue;
        const vx = (p.x - p.px) * 0.986, vy = (p.y - p.py) * 0.986, vz = (p.z - p.pz) * 0.986;
        p.px = p.x; p.py = p.y; p.pz = p.z;
        p.x += vx + wind.x * d2;
        p.y += vy - GRAVITY * d2;
        p.z += vz + wind.z * d2;
      }
    }
    constrain() {
      for (let iter = 0; iter < 12; iter++) {
        for (let i = 1; i < this.particles.length; i++) {
          const a = this.particles[i - 1], b = this.particles[i];
          let dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
          const dist = Math.hypot(dx, dy, dz) || 1e-6;
          const diff = (dist - this.segLen) / dist;
          if (a.fixed) { b.x -= dx * diff; b.y -= dy * diff; b.z -= dz * diff; }
          else {
            a.x += dx * diff * 0.5; a.y += dy * diff * 0.5; a.z += dz * diff * 0.5;
            b.x -= dx * diff * 0.5; b.y -= dy * diff * 0.5; b.z -= dz * diff * 0.5;
          }
        }
      }
    }
    dragTo(target) { // 拖拽末端（招牌挂点）：硬设位置，prev 保留形成甩动惯性
      const end = this.particles[this.particles.length - 1];
      end.px = end.x + (end.x - target.x) * 0.25; // 保留部分速度
      end.py = end.y + (end.y - target.y) * 0.25;
      end.pz = end.z;
      end.x = target.x; end.y = target.y; end.z = target.z;
    }
    updateLine() {
      const attr = this.lineGeo.getAttribute('position');
      this.particles.forEach((p, i) => attr.setXYZ(i, p.x, p.y, p.z));
      attr.needsUpdate = true;
    }
    reset() {
      const [a, ...rest] = this.particles;
      rest.forEach((p, i) => {
        p.x = p.px = a.x; p.y = p.py = a.y - (i + 1) * this.segLen; p.z = p.pz = a.z;
      });
    }
    get end() { return this.particles[this.particles.length - 1]; }
  }
  const chainMain = new Chain(-1.7, 0.05, 6, 0.30);  // 主招牌链
  const chainMenu = new Chain(2.55, -0.05, 5, 0.26); // 菜单招牌链

  /* ═══ 4. 招牌 mesh + HTML-in-Canvas 纹理（ThreeHTMLRenderer） ═══ */
  const htmlRenderer = new ThreeHTMLRenderer();
  htmlRenderer.connect(canvas, camera, renderer);

  function makeSign(el, worldW, worldH, chain) {
    const group = new THREE.Group();               // 链末端挂点
    const plane = new THREE.Mesh(                  // HTML 纹理面
      new THREE.PlaneGeometry(worldW, worldH),
      new THREE.MeshBasicMaterial()
    );
    plane.position.y = -worldH / 2 - 0.06;
    const back = new THREE.Mesh(                   // 背板（厚度感）
      new THREE.BoxGeometry(worldW + 0.08, worldH + 0.08, 0.09),
      new THREE.MeshStandardMaterial({ color: 0x1a1626, roughness: 0.6, metalness: 0.5 })
    );
    back.position.set(0, -worldH / 2 - 0.06, -0.055);
    group.add(back, plane);
    scene.add(group);
    htmlRenderer.addObject(el, plane);             // ★ DOM -> mesh 绑定
    return { group, plane, chain, halfH: worldH / 2 + 0.06 };
  }
  const signMain = makeSign(document.getElementById('signMain'), 3.0, 1.9, chainMain);
  const signMenu = makeSign(document.getElementById('signMenu'), 2.3, 2.4, chainMenu);

  function updateSignPose(s) {                     // 挂点位置 + 链方向姿态
    const end = s.chain.end;
    const before = s.chain.particles[s.chain.particles.length - 2];
    s.group.position.set(end.x, end.y, end.z);
    s.group.rotation.z = Math.atan2(end.x - before.x, before.y - end.y);
  }

  /* ═══ 5. 交互：拖拽 / 双击重置 / HTML 控件 ═══ */
  const raycaster = new THREE.Raycaster();
  const pointer = new THREE.Vector2();
  const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
  let dragTarget = null, hitPoint = new THREE.Vector3();

  function setRay(e) {
    pointer.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
    raycaster.setFromCamera(pointer, camera);
  }
  canvas.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button, input')) return;  // HTML 控件优先，不启动拖拽
    setRay(e);
    const hits = raycaster.intersectObjects([signMain.plane, signMenu.plane]);
    if (hits.length) {
      dragTarget = hits[0].object === signMain.plane ? signMain : signMenu;
      dragPlane.set(new THREE.Vector3(0, 0, 1), -hits[0].point.z);
      canvas.setPointerCapture(e.pointerId);
      canvas.style.cursor = 'grabbing';
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragTarget) return;
    setRay(e);
    if (raycaster.ray.intersectPlane(dragPlane, hitPoint)) {
      // 限制拖拽范围，防止把招牌拉飞
      hitPoint.x = THREE.MathUtils.clamp(hitPoint.x, -5.2, 5.2);
      hitPoint.y = THREE.MathUtils.clamp(hitPoint.y, 1.2, 4.4);
      dragTarget.chain.dragTo(hitPoint);
    }
  });
  const endDrag = () => { dragTarget = null; canvas.style.cursor = 'default'; };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('dblclick', () => { chainMain.reset(); chainMenu.reset(); });

  /* 画布内 HTML 控件 -> 驱动 3D 场景（HTML-in-Canvas 的核心价值） */
  const menus = [
    [['豚骨拉面', '¥28'], ['章鱼小丸子', '¥18'], ['叉烧滑蛋饭', '¥22']],
    [['味噌汤', '¥10'], ['手工煎饺', '¥15'], ['亲子丼', '¥26']],
    [['关东煮', '¥12'], ['玉子烧', '¥14'], ['牛肉乌冬', '¥30']],
  ];
  let menuIdx = 0;
  const menuList = document.getElementById('menuList');
  function renderMenu() {
    menuList.innerHTML = menus[menuIdx]
      .map(([n, p]) => `<li><span>${n}</span><span class="price">${p}</span></li>`).join('');
  }
  renderMenu();
  document.getElementById('shuffle').addEventListener('click', () => {
    menuIdx = (menuIdx + 1) % menus.length;
    renderMenu();
  });

  const signMainEl = document.getElementById('signMain');
  let open = true;
  document.getElementById('statusBtn').addEventListener('click', () => {
    open = !open;
    signMainEl.classList.toggle('closed', !open);
    document.getElementById('statusBtn').textContent = open ? 'OPEN · 点击打烊' : 'CLOSED · 点击营业';
    neonMain.intensity = open ? 14 : 1.5;
  });

  let windStrength = 0.32 * 8;                      // 风力（HTML 滑条驱动）
  document.getElementById('wind').addEventListener('input', (e) => {
    windStrength = (e.target.value / 100) * 8;
    document.getElementById('windVal').textContent = e.target.value;
  });

  /* 实时时钟：DOM 每秒变化 -> paint 事件 -> 纹理自动刷新（活的纹理） */
  const clockEl = document.getElementById('clock');
  function tick() {
    const d = new Date(), pad = (n) => String(n).padStart(2, '0');
    clockEl.textContent = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  }
  tick();
  setInterval(tick, 1000);

  /* ═══ 6. 主循环：物理 -> 姿态 -> HTML 同步 -> 渲染 ═══ */
  let last = performance.now(), windPhase = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min((now - last) / 1000, 1 / 30);
    last = now;
    windPhase += dt;

    // 阵风：两三个正弦叠加 + 招牌相位差
    const gust = windStrength * (Math.sin(windPhase * 0.7) * 0.6 + Math.sin(windPhase * 1.9 + 1.3) * 0.4);
    const wind = { x: gust, z: Math.sin(windPhase * 0.45) * gust * 0.12 };

    chainMain.step(dt, wind);
    chainMenu.step(dt, { x: gust * 0.8, z: wind.z * -1 });  // 相位与强度差
    chainMain.constrain();
    chainMenu.constrain();
    chainMain.updateLine();
    chainMenu.updateLine();
    updateSignPose(signMain);
    updateSignPose(signMenu);

    // 霓虹灯跟随招牌
    neonMain.position.copy(signMain.group.position).add(new THREE.Vector3(0, -1.1, 0.6));
    neonMenu.position.copy(signMenu.group.position).add(new THREE.Vector3(0, -1.2, 0.6));

    htmlRenderer.update();   // ★ DOM overlay 定位 + 纹理上传
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
</script>
</body>
